<!-- App 圖示的來源。PNG 是從這裡算出來的,不要手改 PNG ——
     改這支,再跑 ../adopt-harness/make-icons.sh 重出一輪。

     顏色取自 index.html 的 :root(變數名省略開頭那兩個減號 ——
     XML 的註解裡不准出現連續兩個減號,寫進去整個檔就解析不了):
       board-bg     #12141A  底
       board-amber  #F0B429  塔
       accent       #24457E  地平線那條
     所以圖示跟航班那張黑底板子是同一個家族,不是另外挑的色。

     圖形畫滿整個畫布。Android 的 maskable 版會裁成圓形或圓角方形,
     只保證中心直徑 80% 那一圈留得住 —— 那一版由 make-icons.sh 套 CSS transform
     縮小後另外出一個檔,不在這裡處理。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#12141A"/>

  <!-- 地平線。塔沒有這條會像浮在半空中 -->
  <rect x="96" y="398" width="320" height="10" rx="5" fill="#24457E"/>

  <g fill="#F0B429">
    <!-- 塔身:兩條外緣由下往上收,中間留空當桁架 -->
    <path d="M150 398 C168 330 196 268 222 214 L236 214 C214 272 194 334 184 398 Z"/>
    <path d="M362 398 C344 330 316 268 290 214 L276 214 C298 272 318 334 328 398 Z"/>

    <!-- 大展望台 -->
    <rect x="196" y="196" width="120" height="22" rx="4"/>
    <!-- 上半段 -->
    <path d="M226 196 L240 124 L272 124 L286 196 Z"/>
    <!-- 特別展望台 -->
    <rect x="232" y="110" width="48" height="15" rx="4"/>
    <!-- 天線 -->
    <rect x="251" y="52" width="10" height="60" rx="5"/>
    <circle cx="256" cy="46" r="10"/>
  </g>

  <!-- 桁架的兩道橫撐。細節只留兩道 —— 48px 下畫再多都糊成一塊。
       不要調低 opacity:琥珀壓在近黑的底上會混成髒褐色,看起來像生鏽不像鏤空。
       要讓它退到後面就把線畫細,不要讓它變色。 -->
  <g stroke="#F0B429" stroke-width="7" stroke-linecap="round">
    <path d="M198 310 H314"/>
    <path d="M178 362 H334"/>
  </g>
</svg>
